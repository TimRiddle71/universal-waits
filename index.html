<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<title>Tim's Universal Waits</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:dark;--bg:#05070a;--card:#11151b;--line:#242a33;--muted:#9aa4b2;--text:#f7f8fa;--green:#22c55e;--yellow:#fbbf24;--red:#ef4444;--gray:#6b7280;--accent:#2f7df4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
.app{max-width:720px;margin:auto;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 28px)}
h1{font-size:28px;margin:6px 0 4px;letter-spacing:-.5px}
.sub{color:var(--muted);font-size:14px;margin-bottom:18px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#0d1117;padding:6px;border-radius:16px;position:sticky;top:8px;z-index:5}
.tab{border:0;background:transparent;color:#aab3bf;font-weight:800;font-size:16px;padding:13px 8px;border-radius:12px}
.tab.active{background:var(--accent);color:white}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 10px;gap:10px}
.hours{margin:16px 2px 0;font-size:16px;font-weight:850;line-height:1.25}

.bestbet{background:linear-gradient(135deg,#111923,#11151b);border:1px solid #2f7df4;border-radius:18px;padding:14px 15px;margin:12px 0 14px}
.bestbet-kicker{font-size:12px;font-weight:950;letter-spacing:.12em;color:#7fb0ff;margin-bottom:6px}
.bestbet-name{font-size:18px;font-weight:950;line-height:1.2}
.bestbet-detail{font-size:14px;color:#d8dee8;font-weight:800;margin-top:6px}
.bestbet-why{font-size:12px;color:var(--muted);margin-top:4px}

.hours .detail{display:block;color:var(--muted);font-size:13px;font-weight:650;margin-top:4px}
.updated{font-size:13px;color:var(--muted)}
.refresh{border:1px solid var(--line);background:var(--card);color:white;border-radius:12px;padding:9px 12px;font-weight:700}
.section{font-size:20px;color:#b8c0cb;font-weight:900;letter-spacing:.12em;margin:20px 3px 9px}
.ride{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:12px;padding:16px 15px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin:8px 0}
.dot{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.04)}
.name{font-size:18px;font-weight:750;line-height:1.18}
.waitbox{text-align:right;white-space:nowrap}
.gonow{display:inline-block;background:#ff7a00;color:#fff;font-size:11px;font-weight:950;letter-spacing:.04em;padding:4px 7px;border-radius:999px;margin-bottom:5px}
.trend{font-size:18px;font-weight:950;margin-right:5px}
.trend.down{color:var(--green)}
.trend.up{color:var(--red)}
.trend.steady{color:var(--muted)}
.wait{font-size:20px;font-weight:900;white-space:nowrap}
.note{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-top:4px}
.error{background:#2a1114;border:1px solid #5c1e25;color:#ffb4bc;padding:13px;border-radius:14px;margin-top:14px}
.credit{text-align:center;color:#7f8997;font-size:12px;margin:28px 0 5px}
.credit a{color:#9cbcff}
.star{color:#ffd34d;margin-right:5px}
</style>
</head>
<body>
<div class="app">
  <h1>Universal Waits</h1>
  <div class="sub">Tim's quick-glance board</div>

  <div class="tabs">
    <button class="tab active" data-park="usf">Universal Studios</button>
    <button class="tab" data-park="ioa">Islands of Adventure</button>
  </div>

  <div id="bestbet"></div>
    <div id="hours" class="hours">Loading today’s park hours…</div>

  <div class="toolbar">
    <div id="updated" class="updated">Loading live waits…</div>
    <button id="refresh" class="refresh">↻ Refresh</button>
  </div>

  <div id="error"></div>
  <div id="rides"></div>
  <div class="credit">Powered by <a href="https://themeparks.wiki/" target="_blank" rel="noopener">ThemeParks.wiki</a></div>
</div>

<script>
const PARKS = {
  usf: {
    name: "Universal Studios Florida",
    id: "eb3f4560-2383-4a36-9152-6b3e5ed6bc57",
    favorites: [
      "Harry Potter and the Escape from Gringotts",
      "Revenge of the Mummy",
      "MEN IN BLACK Alien Attack",
      "TRANSFORMERS: The Ride-3D",
      "E.T. Adventure",
      "Despicable Me Minion Mayhem",
      "Hogwarts Express - King's Cross Station"
    ]
  },
  ioa: {
    name: "Universal Islands of Adventure",
    id: "267615cc-8943-4c2a-ae2c-5da728ca591f",
    favorites: [
      "Hagrid's Magical Creatures Motorbike Adventure",
      "Jurassic World VelociCoaster",
      "Harry Potter and the Forbidden Journey",
      "The Incredible Hulk Coaster",
      "The Amazing Adventures of Spider-Man",
      "Skull Island: Reign of Kong",
      "Doctor Doom's Fearfall",
      "The High in the Sky Seuss Trolley Train Ride!",
      "Hogwarts Express - Hogsmeade Station"
    ]
  }
};


// Historical posted-wait baselines (minutes). These are used only to judge
// whether a live wait is good/normal/high FOR THAT RIDE.
const WAIT_BASELINES = {
  // Islands of Adventure — Queue-Times all-time averages
  "hagrids magical creatures motorbike adventure": 95,
  "jurassic world velocicoaster": 56,
  "skull island reign of kong": 35,
  "flight of the hippogriff": 34,
  "harry potter and the forbidden journey": 32,
  "pteranodon flyers": 32,
  "the incredible hulk coaster": 32,
  "the amazing adventures of spider man": 29,
  "dudley do rights ripsaw falls": 27,
  "hogwarts express hogsmeade station": 22,
  "jurassic park river adventure": 22,
  "the high in the sky seuss trolley train ride": 20,
  "doctor dooms fearfall": 15,
  "popeye blutos bilge rat barges": 14,
  "one fish two fish red fish blue fish": 13,
  "ollivanders experience in hogsmeade": 12,
  "the cat in the hat": 9,
  "caro seuss el": 6,
  "storm force accelatron": 6,

  // Universal Studios — historical/current averages for the rides Tim cares about
  "harry potter and the escape from gringotts": 46,
  "revenge of the mummy": 31,
  "despicable me minion mayhem": 32,
  "transformers the ride 3d": 29,
  "et adventure": 24,
  "hogwarts express kings cross station": 24,
  "men in black alien attack": 21
};

function round5(n){ return Math.max(5, Math.round(n / 5) * 5); }

function smartThresholds(name){
  const base = WAIT_BASELINES[norm(name)];
  if(!base) return null;
  // Green = meaningfully better than normal; red = meaningfully worse.
  // GO NOW is deliberately rarer: at least 40% below the historical baseline.
  return {
    base,
    good: round5(base * 0.75),
    high: round5(base * 1.35),
    goNow: base * 0.60
  };
}

let current = "usf";
let timer;

const norm = s => (s || "")
  .toLowerCase()
  .replace(/[™®’']/g,"")
  .replace(/[^a-z0-9]+/g," ")
  .trim();

function isFavorite(name, favs){
  const n = norm(name);
  return favs.some(f => {
    const x = norm(f);
    return n === x || n.includes(x) || x.includes(n);
  });
}

function standbyWait(r){
  const q = r.queue || {};
  const s = q.STANDBY || q.standby;
  return s && Number.isFinite(Number(s.waitTime)) ? Number(s.waitTime) : null;
}

function displayState(r){
  const status = String(r.status || "").toUpperCase();
  const wait = standbyWait(r);
  if (status === "OPERATING" && wait !== null) {
    const t = smartThresholds(r.name);
    if(t){
      const c = wait <= t.good ? "var(--green)" : wait >= t.high ? "var(--red)" : "var(--yellow)";
      return {text:`${wait} min`, c, rank:0, goNow: wait <= t.goNow};
    }
    // Fallback only for attractions without a historical baseline yet.
    return {text:`${wait} min`, c: wait <= 25 ? "var(--green)" : wait <= 45 ? "var(--yellow)" : "var(--red)", rank:0};
  }
  if (status === "DOWN") return {text:"DOWN", c:"var(--red)", rank:2};
  if (status === "REFURBISHMENT") return {text:"REFURB", c:"var(--gray)", rank:4};
  if (status === "CLOSED") return {text:"CLOSED", c:"var(--gray)", rank:3};
  if (status === "OPERATING") return {text:"OPEN", c:"var(--green)", rank:1};
  return {text: status || "—", c:"var(--gray)", rank:5};
}

function freshest(rows){
  const times = rows.map(r => Date.parse(r.lastUpdated)).filter(Number.isFinite);
  return times.length ? new Date(Math.max(...times)) : new Date();
}

function ageText(d){
  const mins = Math.max(0, Math.round((Date.now()-d.getTime())/60000));
  if (mins < 1) return "Updated just now";
  if (mins === 1) return "Updated 1 min ago";
  return `Updated ${mins} min ago`;
}


const TREND_KEY = "universalWaitTrendHistoryV1";

function readTrendHistory(){
  try { return JSON.parse(localStorage.getItem(TREND_KEY) || "{}"); }
  catch(e) { return {}; }
}

function trendFor(r){
  const wait = standbyWait(r);
  if(wait === null) return null;

  const history = readTrendHistory();
  const key = `${current}:${norm(r.name)}`;
  const samples = Array.isArray(history[key]) ? history[key] : [];
  const now = Date.now();

  // Aim for ~15 minutes ago. Require at least 10 minutes of separation,
  // and ignore samples older than 30 minutes for the quick-glance trend.
  const eligible = samples.filter(x =>
    Number.isFinite(x.t) && Number.isFinite(x.wait) &&
    now - x.t >= 10*60*1000 && now - x.t <= 30*60*1000
  );
  if(!eligible.length) return null;

  const target = now - 15*60*1000;
  eligible.sort((a,b) => Math.abs(a.t-target) - Math.abs(b.t-target));
  const previous = eligible[0].wait;
  const change = wait - previous;

  if(change <= -10) return {symbol:"↓", cls:"down", label:`Falling ${Math.abs(change)} min`};
  if(change >= 10) return {symbol:"↑", cls:"up", label:`Rising ${change} min`};
  return {symbol:"→", cls:"steady", label:"Steady"};
}

function saveTrendSamples(rows, parkKey){
  const history = readTrendHistory();
  const now = Date.now();
  const cutoff = now - 2*60*60*1000;

  rows.forEach(r => {
    const wait = standbyWait(r);
    if(wait === null) return;
    const key = `${parkKey}:${norm(r.name)}`;
    const samples = Array.isArray(history[key]) ? history[key].filter(x => x.t >= cutoff) : [];

    // Don't create duplicate samples during rapid manual refreshes.
    const last = samples[samples.length-1];
    if(!last || now - last.t >= 4*60*1000){
      samples.push({t:now, wait});
    }
    history[key] = samples.slice(-30);
  });

  try { localStorage.setItem(TREND_KEY, JSON.stringify(history)); }
  catch(e) {}
}


function bestBetScore(r, favorite){
  const wait = standbyWait(r);
  const t = smartThresholds(r.name);
  if(wait === null || !t || wait <= 0) return null;

  // Opportunity is primarily "how much better than normal is this ride right now?"
  // A favorite gets a modest nudge, but cannot overpower a genuinely exceptional deal.
  const ratio = wait / t.base;
  let score = (1 - ratio) * 100;

  if(wait <= t.goNow) score += 22;
  if(favorite) score += 8;

  const trend = trendFor(r);
  if(trend?.cls === "down") score += 12;
  if(trend?.cls === "up") score -= 8;

  return {score, wait, base:t.base, ratio, trend};
}

function renderBestBet(rows, parkKey){
  const el = document.getElementById("bestbet");
  if(!el) return;

  const favs = new Set(PARKS[parkKey].favorites.map(norm));
  const candidates = rows
    // Hogwarts Express is transportation between parks, not a Best Bet attraction.
    .filter(r => !norm(r.name).startsWith("hogwarts express"))
    .map(r => ({r, b:bestBetScore(r, favs.has(norm(r.name)))}))
    .filter(x => x.b && x.b.ratio <= 0.90)
    .sort((a,b) => b.b.score - a.b.score);

  if(!candidates.length){
    el.innerHTML = "";
    return;
  }

  const {r,b} = candidates[0];
  const pct = Math.max(0, Math.round((1 - b.ratio) * 100));
  const trendText = b.trend
    ? (b.trend.cls === "down" ? "↓ Falling" : b.trend.cls === "up" ? "↑ Rising" : "→ Steady")
    : "Trend learning…";
  const fire = b.ratio <= 0.60 ? "🔥 " : "";

  el.innerHTML = `<div class="bestbet">
    <div class="bestbet-kicker">🎯 BEST BET RIGHT NOW</div>
    <div class="bestbet-name">${r.name}</div>
    <div class="bestbet-detail">${fire}${b.wait} min · ${trendText}</div>
    <div class="bestbet-why">About ${pct}% better than this ride’s normal wait</div>
  </div>`;
}


const STATUS_HISTORY_KEY = "universalWaitStatusHistoryV1";

function readStatusHistory(){
  try { return JSON.parse(localStorage.getItem(STATUS_HISTORY_KEY) || "{}"); }
  catch(e) { return {}; }
}

function statusCode(r){
  return String(r.status || "").toUpperCase();
}

function statusIntelFor(r){
  const history = readStatusHistory();
  const key = `${current}:${norm(r.name)}`;
  const h = history[key];
  if(!h) return null;

  const now = Date.now();
  const status = statusCode(r);

  if(status === "DOWN" && h.downSince){
    const mins = Math.max(1, Math.floor((now - h.downSince) / 60000));
    return {cls:"down", text:`DOWN · ${mins}+ min`};
  }

  // Show reopening intelligence for the first 30 minutes after a DOWN -> OPERATING transition.
  if(status === "OPERATING" && h.reopenedAt){
    const mins = Math.max(0, Math.floor((now - h.reopenedAt) / 60000));
    if(mins <= 30) return {cls:"reopened", text:`REOPENED ${mins} min ago`};
  }

  return null;
}

function updateStatusHistory(rows, parkKey){
  const history = readStatusHistory();
  const now = Date.now();

  rows.forEach(r => {
    const key = `${parkKey}:${norm(r.name)}`;
    const status = statusCode(r);
    const h = history[key] || {};
    const previous = h.lastStatus;

    if(status === "DOWN"){
      if(previous !== "DOWN" || !h.downSince) h.downSince = now;
      h.reopenedAt = null;
    } else if(status === "OPERATING"){
      if(previous === "DOWN" && h.downSince){
        h.reopenedAt = now;
        h.downSince = null;
      } else if(h.reopenedAt && now - h.reopenedAt > 30*60*1000){
        h.reopenedAt = null;
      }
    } else {
      // CLOSED/REFURB/etc. are not treated as technical downtime or a reopening.
      h.downSince = null;
      h.reopenedAt = null;
    }

    h.lastStatus = status;
    h.lastSeen = now;
    history[key] = h;
  });

  // Drop stale entries after 7 days.
  Object.keys(history).forEach(key => {
    if(!history[key].lastSeen || now - history[key].lastSeen > 7*24*60*60*1000) delete history[key];
  });

  try { localStorage.setItem(STATUS_HISTORY_KEY, JSON.stringify(history)); }
  catch(e) {}
}

function rideHTML(r, favorite){
  const s = displayState(r);
  const trend = trendFor(r);
  const intel = statusIntelFor(r);
  const lu = r.lastUpdated ? new Date(r.lastUpdated) : null;
  const fresh = lu && !isNaN(lu) ? `Updated ${lu.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}` : "";
  const trendHTML = trend ? `<span class="trend ${trend.cls}" title="${trend.label}" aria-label="${trend.label}">${trend.symbol}</span>` : "";
  const intelHTML = intel ? `<span class="statusintel ${intel.cls}">${intel.text}</span>` : "";
  return `<div class="ride">
    <span class="dot" style="background:${s.c}"></span>
    <div class="name">${favorite ? '<span class="star">★</span>' : ''}${r.name}<span class="note">${fresh}</span>${intelHTML}</div>
    <div class="waitbox">${s.goNow ? '<div class="gonow">🔥 GO NOW</div>' : ''}<div class="wait">${trendHTML}${s.text}</div></div>
  </div>`;
}


function orlandoDateKey(){
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone:"America/New_York", year:"numeric", month:"2-digit", day:"2-digit"
  }).formatToParts(new Date());
  const p = Object.fromEntries(parts.map(x => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day}`;
}

function formatOrlandoTime(iso){
  return new Intl.DateTimeFormat("en-US", {
    timeZone:"America/New_York", hour:"numeric", minute:"2-digit"
  }).format(new Date(iso));
}

function durationText(ms){
  const total = Math.max(0, Math.ceil(ms/60000));
  const h = Math.floor(total/60), m = total % 60;
  if(h && m) return `${h} hr ${m} min`;
  if(h) return `${h} hr`;
  return `${m} min`;
}

async function loadHours(parkKey){
  const park = PARKS[parkKey];
  const el = document.getElementById("hours");
  try{
    const res = await fetch(`https://api.themeparks.wiki/v1/entity/${park.id}/schedule`, {cache:"no-store"});
    if(!res.ok) throw new Error("schedule unavailable");
    const data = await res.json();
    const rows = Array.isArray(data) ? data : (data.schedule || []);
    const today = orlandoDateKey();
    const s = rows.find(x => x.date === today && String(x.type).toUpperCase() === "OPERATING")
           || rows.find(x => x.date === today && x.openingTime && x.closingTime);
    if(current !== parkKey) return;
    if(!s){
      el.innerHTML = `Park hours unavailable<span class="detail">No operating schedule found for today</span>`;
      return;
    }
    const now=Date.now(), open=Date.parse(s.openingTime), close=Date.parse(s.closingTime);
    let headline;
    if(now < open) headline = `🕐 Opens in ${durationText(open-now)}`;
    else if(now < close) headline = `🕐 Closes in ${durationText(close-now)}`;
    else headline = "🕐 Closed for today";
    el.innerHTML = `${headline}<span class="detail">Today ${formatOrlandoTime(s.openingTime)} – ${formatOrlandoTime(s.closingTime)}</span>`;
  }catch(e){
    if(current === parkKey) el.innerHTML = `Park hours unavailable<span class="detail">Wait times still work normally</span>`;
  }
}

async function load(){
  const parkKey = current;
  const park = PARKS[parkKey];
  loadHours(parkKey);
  document.getElementById("error").innerHTML = "";
  document.getElementById("updated").textContent = "Loading live waits…";
  try{
    const res = await fetch(`https://api.themeparks.wiki/v1/entity/${park.id}/live`, {cache:"no-store"});
    if(!res.ok) throw new Error(`API returned ${res.status}`);
    const data = await res.json();
    const rows = (data.liveData || data).filter(r => r && r.name && (r.entityType === "ATTRACTION" || r.queue || r.status));

    const favorites = rows.filter(r => isFavorite(r.name, park.favorites));
    const others = rows.filter(r => !isFavorite(r.name, park.favorites));

    const sorter = (a,b) => {
      const A=displayState(a), B=displayState(b);
      if(A.rank!==B.rank) return A.rank-B.rank;
      const aw=standbyWait(a), bw=standbyWait(b);
      if(aw!==null && bw!==null && aw!==bw) return aw-bw;
      return a.name.localeCompare(b.name);
    };
    favorites.sort((a,b) => park.favorites.findIndex(f=>isFavorite(a.name,[f])) - park.favorites.findIndex(f=>isFavorite(b.name,[f])));
    others.sort(sorter);

    document.getElementById("rides").innerHTML =
      `<div class="section">★ FAVORITES</div>${favorites.map(r=>rideHTML(r,true)).join("") || '<div class="ride"><div></div><div class="name">No favorite matches found</div><div></div></div>'}
       <div class="section">ALL OTHER ATTRACTIONS</div>${others.map(r=>rideHTML(r,false)).join("")}`;

    document.getElementById("updated").textContent = `${park.name} • ${ageText(freshest(rows))}`;
    renderBestBet(rows, parkKey);
    saveTrendSamples(rows, parkKey);
    updateStatusHistory(rows, parkKey);
  }catch(e){
    document.getElementById("updated").textContent = "Could not update";
    document.getElementById("error").innerHTML =
      `<div class="error"><b>Live data didn't load.</b><br>${e.message}. Try Refresh. If this file is opened directly from Files, we may need to host it as a tiny web app for iPhone Safari.</div>`;
  }
}

document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
  current = b.dataset.park;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active", x===b));
  load();
}));

document.getElementById("refresh").addEventListener("click", load);
load();
timer = setInterval(load, 5*60*1000);
</script>
</body>
</html>

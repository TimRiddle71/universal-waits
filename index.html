<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<title>Tim's Universal Waits</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">  
<style>
:root{color-scheme:dark;--bg:#05070a;--card:#11151b;--line:#242a33;--muted:#9aa4b2;--text:#f7f8fa;--green:#22c55e;--yellow:#fbbf24;--red:#ef4444;--gray:#6b7280;--accent:#2f7df4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
.app{max-width:720px;margin:auto;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 28px)}
h1{font-size:28px;margin:6px 0 4px;letter-spacing:-.5px}
.sub{color:var(--muted);font-size:14px;margin-bottom:18px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#0d1117;padding:6px;border-radius:16px;position:sticky;top:8px;z-index:5}
.tab{border:0;background:transparent;color:#aab3bf;font-weight:800;font-size:16px;padding:13px 8px;border-radius:12px}
.tab.active{background:var(--accent);color:white}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 10px;gap:10px}
.updated{font-size:13px;color:var(--muted)}
.refresh{border:1px solid var(--line);background:var(--card);color:white;border-radius:12px;padding:9px 12px;font-weight:700}
.section{font-size:13px;color:#b8c0cb;font-weight:900;letter-spacing:.12em;margin:20px 3px 9px}
.ride{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:12px;padding:16px 15px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin:8px 0}
.dot{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.04)}
.name{font-size:18px;font-weight:750;line-height:1.18}
.wait{font-size:20px;font-weight:900;white-space:nowrap}
.note{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-top:4px}
.error{background:#2a1114;border:1px solid #5c1e25;color:#ffb4bc;padding:13px;border-radius:14px;margin-top:14px}
.credit{text-align:center;color:#7f8997;font-size:12px;margin:28px 0 5px}
.credit a{color:#9cbcff}
.star{color:#ffd34d;margin-right:5px}
</style>
</head>
<body>
<div class="app">
  <h1>Universal Waits</h1>
  <div class="sub">Tim's quick-glance board</div>

  <div class="tabs">
  <button class="tab active" data-park="usf">Universal Studios</button>
  <button class="tab" data-park="ioa">Islands of Adventure</button>
  </div>

  <div class="toolbar">
    <div id="updated" class="updated">Loading live waits…</div>
    <button id="refresh" class="refresh">↻ Refresh</button>
  </div>

  <div id="error"></div>
  <div id="rides"></div>
  <div class="credit">Powered by <a href="https://themeparks.wiki/" target="_blank" rel="noopener">ThemeParks.wiki</a></div>
</div>

<script>
const PARKS = {
  usf: {
    name: "Universal Studios Florida",
    id: "eb3f4560-2383-4a36-9152-6b3e5ed6bc57",
    favorites: [
      "Harry Potter and the Escape from Gringotts",
      "Revenge of the Mummy",
      "MEN IN BLACK Alien Attack",
      "TRANSFORMERS: The Ride-3D",
      "E.T. Adventure",
      "Despicable Me Minion Mayhem",
      "Hogwarts Express - King's Cross Station"
    ]
  },
  ioa: {
    name: "Universal Islands of Adventure",
    id: "267615cc-8943-4c2a-ae2c-5da728ca591f",
    favorites: [
      "Hagrid's Magical Creatures Motorbike Adventure",
      "Jurassic World VelociCoaster",
      "Harry Potter and the Forbidden Journey",
      "The Incredible Hulk Coaster",
      "The Amazing Adventures of Spider-Man",
      "Skull Island: Reign of Kong",
      "Doctor Doom's Fearfall",
      "The High in the Sky Seuss Trolley Train Ride!",
      "Hogwarts Express - Hogsmeade Station"
    ]
  }
};

let current = "usf";
let timer;

const norm = s => (s || "")
  .toLowerCase()
  .replace(/[™®’']/g,"")
  .replace(/[^a-z0-9]+/g," ")
  .trim();

function isFavorite(name, favs){
  const n = norm(name);
  return favs.some(f => {
    const x = norm(f);
    return n === x || n.includes(x) || x.includes(n);
  });
}

function standbyWait(r){
  const q = r.queue || {};
  const s = q.STANDBY || q.standby;
  return s && Number.isFinite(Number(s.waitTime)) ? Number(s.waitTime) : null;
}

function displayState(r){
  const status = String(r.status || "").toUpperCase();
  const wait = standbyWait(r);
  if (status === "OPERATING" && wait !== null) return {text:`${wait} min`, c: wait <= 25 ? "var(--green)" : wait <= 45 ? "var(--yellow)" : "var(--red)", rank:0};
  if (status === "DOWN") return {text:"DOWN", c:"var(--red)", rank:2};
  if (status === "REFURBISHMENT") return {text:"REFURB", c:"var(--gray)", rank:4};
  if (status === "CLOSED") return {text:"CLOSED", c:"var(--gray)", rank:3};
  if (status === "OPERATING") return {text:"OPEN", c:"var(--green)", rank:1};
  return {text: status || "—", c:"var(--gray)", rank:5};
}

function freshest(rows){
  const times = rows.map(r => Date.parse(r.lastUpdated)).filter(Number.isFinite);
  return times.length ? new Date(Math.max(...times)) : new Date();
}

function ageText(d){
  const mins = Math.max(0, Math.round((Date.now()-d.getTime())/60000));
  if (mins < 1) return "Updated just now";
  if (mins === 1) return "Updated 1 min ago";
  return `Updated ${mins} min ago`;
}

function rideHTML(r, favorite){
  const s = displayState(r);
  const lu = r.lastUpdated ? new Date(r.lastUpdated) : null;
  const fresh = lu && !isNaN(lu) ? `Updated ${lu.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}` : "";
  return `<div class="ride">
    <span class="dot" style="background:${s.c}"></span>
    <div class="name">${favorite ? '<span class="star">★</span>' : ''}${r.name}<span class="note">${fresh}</span></div>
    <div class="wait">${s.text}</div>
  </div>`;
}

async function load(){
  const park = PARKS[current];
  document.getElementById("error").innerHTML = "";
  document.getElementById("updated").textContent = "Loading live waits…";
  try{
    const res = await fetch(`https://api.themeparks.wiki/v1/entity/${park.id}/live`, {cache:"no-store"});
    if(!res.ok) throw new Error(`API returned ${res.status}`);
    const data = await res.json();
    const rows = (data.liveData || data).filter(r => r && r.name && (r.entityType === "ATTRACTION" || r.queue || r.status));

    const favorites = rows.filter(r => isFavorite(r.name, park.favorites));
    const others = rows.filter(r => !isFavorite(r.name, park.favorites));

    const sorter = (a,b) => {
      const A=displayState(a), B=displayState(b);
      if(A.rank!==B.rank) return A.rank-B.rank;
      const aw=standbyWait(a), bw=standbyWait(b);
      if(aw!==null && bw!==null && aw!==bw) return aw-bw;
      return a.name.localeCompare(b.name);
    };
    favorites.sort((a,b) => park.favorites.findIndex(f=>isFavorite(a.name,[f])) - park.favorites.findIndex(f=>isFavorite(b.name,[f])));
    others.sort(sorter);

    document.getElementById("rides").innerHTML =
      `<div class="section">★ FAVORITES</div>${favorites.map(r=>rideHTML(r,true)).join("") || '<div class="ride"><div></div><div class="name">No favorite matches found</div><div></div></div>'}
       <div class="section">ALL OTHER ATTRACTIONS</div>${others.map(r=>rideHTML(r,false)).join("")}`;

    document.getElementById("updated").textContent = `${park.name} • ${ageText(freshest(rows))}`;
  }catch(e){
    document.getElementById("updated").textContent = "Could not update";
    document.getElementById("error").innerHTML =
      `<div class="error"><b>Live data didn't load.</b><br>${e.message}. Try Refresh. If this file is opened directly from Files, we may need to host it as a tiny web app for iPhone Safari.</div>`;
  }
}

document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
  current = b.dataset.park;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active", x===b));
  load();
}));

document.getElementById("refresh").addEventListener("click", load);
load();
timer = setInterval(load, 5*60*1000);
</script>
</body>
</html>
